<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Warehouse QA Documentation</title>
<link rel="icon" type="image/png" href="elogo.png">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  :root{
    /* Earthful brand palette — cream/ivory background, olive green accents,
       warm charcoal text. These variables are used throughout the whole
       site (sidebar, buttons, badges, cards, etc.), so re-mapping them here
       re-themes everything consistently in one place. */
    --green-900:#33391f;   /* deep olive — sidebar bg, dark headings */
    --green-700:#525f2e;   /* medium olive — primary buttons, highlights */
    --green-500:#707c48;   /* Earthful's announcement-bar olive — active nav, accents */
    --green-100:#eef1e1;   /* pale sage — light badges, chip backgrounds */
    --gray-900:#2b2a26;    /* warm charcoal — body text */
    --gray-600:#6b6a60;    /* warm mid-gray — secondary text/subtitles */
    --gray-300:#e3ded0;    /* warm light border */
    --gray-100:#faf3e7;    /* cream — page background */
    --red-600:#c0392b;
    --red-100:#fdecea;
    --amber-600:#b8860b;
    --amber-100:#fef6e0;
    --white:#ffffff;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--gray-100);
    color:var(--gray-900);
  }
  /* Top header — modeled on Earthful's own site: a cream row with the logo
     and wordmark, then an olive announcement-style strip underneath. */
  #site-header-top{
    display:flex;align-items:center;justify-content:center;gap:12px;
    background:var(--white);color:var(--gray-900);
    padding:14px 24px;border-bottom:1px solid var(--gray-300);position:relative;
  }
  #site-header-top .logo{width:40px;height:40px;border-radius:50%;object-fit:contain;flex-shrink:0;}
  #site-header-top .site-titles{display:flex;flex-direction:column;align-items:center;line-height:1.2;}
  #site-header-top .site-titles .company-name{
    font-size:20px;font-weight:700;letter-spacing:0.04em;text-transform:uppercase;color:var(--gray-900);
  }
  #site-header-top .site-titles .company-sub{font-size:11.5px;letter-spacing:0.08em;text-transform:uppercase;color:var(--gray-600);margin-top:2px;}
  #site-header-banner{
    background:var(--green-500);color:var(--white);text-align:center;
    padding:9px 16px;font-size:12px;font-weight:600;letter-spacing:0.12em;text-transform:uppercase;
  }
  #app-shell{display:flex;min-height:100vh;}
  #sidebar{
    width:250px;
    background:var(--green-900);
    color:var(--white);
    padding:20px 0;
    flex-shrink:0;
  }
  #sidebar .brand{
    padding:0 20px 16px;
    border-bottom:1px solid rgba(255,255,255,0.12);
    margin-bottom:12px;
  }
  #sidebar .brand h1{font-size:16px;margin:0 0 2px;font-weight:700;}
  #sidebar .brand p{font-size:12px;margin:0;color:rgba(255,255,255,0.65);}
  .nav-section{padding:6px 12px 14px;}
  .nav-section-title{font-size:11px;text-transform:uppercase;letter-spacing:0.05em;color:rgba(255,255,255,0.45);padding:8px 8px 4px;}
  .nav-link{
    display:block;padding:9px 12px;border-radius:8px;color:rgba(255,255,255,0.88);
    text-decoration:none;font-size:13.5px;cursor:pointer;
  }
  .nav-link:hover{background:rgba(255,255,255,0.08);}
  .nav-link.active{background:var(--green-500);color:var(--white);font-weight:600;}
  .nav-badge{background:var(--red-600);color:#fff;border-radius:10px;padding:1px 7px;font-size:11px;font-weight:700;margin-left:4px;}
  .nav-link-highlight{background:var(--green-700);}
  .nav-link-highlight:hover{background:var(--green-500);}
  .nav-sub{display:block;padding:6px 12px 6px 24px;border-radius:8px;color:rgba(255,255,255,0.7);text-decoration:none;font-size:12.5px;cursor:pointer;}
  .nav-sub:hover{background:rgba(255,255,255,0.08);}
  .nav-sub.active{background:rgba(255,255,255,0.14);color:var(--white);font-weight:600;}
  #main{flex:1;padding:28px 34px;max-width:1100px;}
  h2{margin-top:0;font-size:22px;color:var(--green-900);}
  .subtitle{color:var(--gray-600);font-size:13.5px;margin-top:-6px;margin-bottom:22px;}
  .card{background:var(--white);border:1px solid var(--gray-300);border-radius:var(--radius);padding:20px;margin-bottom:20px;}
  .grid-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:24px;}
  .stat-card{background:var(--white);border:1px solid var(--gray-300);border-radius:var(--radius);padding:16px 18px;}
  .stat-card .num{font-size:26px;font-weight:700;color:var(--green-700);}
  .stat-card .label{font-size:12.5px;color:var(--gray-600);margin-top:2px;}
  .stat-card.flagged .num{color:var(--red-600);}
  form .field{margin-bottom:14px;}
  label{display:block;font-size:13px;font-weight:600;margin-bottom:5px;color:var(--gray-900);}
  input[type=text],input[type=number],input[type=date],input[type=time],select,textarea{
    width:100%;padding:9px 10px;border:1px solid var(--gray-300);border-radius:7px;font-size:13.5px;font-family:inherit;background:var(--white);
  }
  textarea{min-height:64px;resize:vertical;}
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 18px;}
  .form-grid .full{grid-column:1 / -1;}
  .btn{
    display:inline-block;padding:9px 16px;border-radius:7px;border:none;font-size:13.5px;font-weight:600;
    cursor:pointer;text-decoration:none;
  }
  .btn-primary{background:var(--green-700);color:var(--white);}
  .btn-primary:hover{background:var(--green-900);}
  .btn-secondary{background:var(--white);color:var(--green-700);border:1px solid var(--green-700);}
  .btn-secondary:hover{background:var(--green-100);}
  .btn-danger{background:var(--white);color:var(--red-600);border:1px solid var(--red-600);}
  .btn-small{padding:5px 10px;font-size:12px;}
  .btn-row{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--gray-300);vertical-align:top;}
  th{background:var(--gray-100);font-weight:700;color:var(--gray-900);white-space:nowrap;}
  tr.flagged{background:var(--red-100);}
  .badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:700;}
  .badge-ok{background:var(--green-100);color:var(--green-700);}
  .badge-flag{background:var(--red-100);color:var(--red-600);}
  .toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:10px;flex-wrap:wrap;}
  .toolbar input[type=search]{max-width:240px;}
  .empty-state{color:var(--gray-600);font-size:13.5px;padding:20px 0;text-align:center;}
  .footer-actions{margin-top:28px;padding-top:16px;border-top:1px solid var(--gray-300);display:flex;gap:10px;flex-wrap:wrap;}
  .required-mark{color:var(--red-600);}
  .photo-section{margin:6px 0 18px;}
  .photo-section > label{display:block;font-size:13px;font-weight:600;margin-bottom:6px;color:var(--gray-900);}
  .photo-section input[type=file]{font-size:13px;}
  .image-preview-grid{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px;}
  .image-thumb{position:relative;width:90px;height:90px;border-radius:8px;overflow:hidden;border:1px solid var(--gray-300);}
  .image-thumb img{width:100%;height:100%;object-fit:cover;display:block;}
  .image-thumb .remove-btn{
    position:absolute;top:3px;right:3px;background:rgba(0,0,0,0.6);color:#fff;width:18px;height:18px;
    border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;cursor:pointer;line-height:1;
  }
  .toast{
    position:fixed;bottom:20px;right:20px;background:var(--green-900);color:#fff;padding:10px 18px;
    border-radius:8px;font-size:13.5px;box-shadow:0 4px 14px rgba(0,0,0,0.2);opacity:0;transition:opacity .25s;z-index:999;
  }
  .toast.show{opacity:1;}
  .list-add-row{display:flex;gap:8px;margin-bottom:14px;}
  .list-add-row input{flex:1;}
  .list-chips{display:flex;flex-wrap:wrap;gap:8px;}
  .list-chip{
    display:inline-flex;align-items:center;gap:6px;background:var(--green-100);color:var(--green-900);
    padding:5px 10px;border-radius:20px;font-size:12.5px;
  }
  .remove-chip{cursor:pointer;font-weight:700;color:var(--green-700);}
  .remove-chip:hover{color:var(--red-600);}
  .form-checkbox-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px;margin:14px 0;}
  .form-checkbox-item{display:flex;align-items:center;gap:8px;font-size:13.5px;padding:8px 10px;border:1px solid var(--gray-300);border-radius:8px;background:var(--gray-100);}
  .chip-count{margin-left:auto;background:var(--green-100);color:var(--green-700);padding:1px 8px;border-radius:12px;font-size:11.5px;font-weight:700;}
  .compile-status{font-size:13px;color:var(--green-700);margin-top:10px;min-height:18px;}
  .banner-warning{background:var(--amber-100);color:var(--amber-600);border:1px solid var(--amber-600);border-radius:8px;padding:10px 14px;font-size:13px;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;}
  /* In-app modal — replaces native prompt()/confirm()/alert(), which are blocked or
     unreliable when this page runs inside a sandboxed Google Sites embed iframe. */
  .app-modal-overlay{
    position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(20,30,25,0.45);
    display:flex;align-items:center;justify-content:center;z-index:1000;padding:20px;
  }
  .app-modal{
    background:#fff;border-radius:10px;box-shadow:0 10px 40px rgba(0,0,0,0.25);
    width:100%;max-width:420px;padding:22px;
  }
  .app-modal-msg{font-size:14px;color:var(--green-900);white-space:pre-wrap;margin-bottom:14px;line-height:1.5;}
  .app-modal-input{width:100%;margin-bottom:4px;}
  .app-modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;}
  @media (max-width:800px){
    #site-header-top{padding:12px 16px;}
    #site-header-top .site-titles .company-name{font-size:16px;}
    #site-header-banner{font-size:10.5px;letter-spacing:0.08em;padding:8px 10px;}
    #app-shell{flex-direction:column;}
    #sidebar{width:100%;}
    #main{padding:20px;}
    .form-grid{grid-template-columns:1fr;}
  }
</style>
</head>
<body>
<header>
  <div id="site-header-top">
    <img src="logo.png" alt="Earthful logo" class="logo" onerror="this.style.display='none'">
    <div class="site-titles">
      <span class="company-name">Kenzen Ventures Pvt Ltd</span>
      <span class="company-sub">Earthful</span>
    </div>
  </div>
  <div id="site-header-banner">QA Documents — Warehouse Quality Assurance Records</div>
</header>
<div id="app-shell">
  <div id="sidebar">
    <div class="brand">
      <h1>Warehouse QA Docs</h1>
      <p>Kenzen Ventures / Earthful</p>
    </div>
    <div id="nav"></div>
  </div>
  <div id="main"></div>
</div>
<div class="toast" id="toast"></div>

<script>

   FORM DEFINITIONS

const STORAGE_KEY = "kenzenQA_records_v1";

/* ---------------------------------------------------------
   DATA LAYER
--------------------------------------------------------- */
function loadData(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : {};
  }catch(e){ return {}; }
}
function saveData(data){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}
function getRecords(formId){
  const data = loadData();
  return data[formId] || [];
}
async function addRecord(formId, record){
  const data = loadData();
  if(!data[formId]) data[formId] = [];
  const user = await ensureCurrentUser();
  record.id = "r" + Date.now() + "_" + Math.floor(Math.random()*10000);
  record.createdAt = new Date().toISOString();
  record.createdBy = user;
  record.updatedAt = record.createdAt;
  record.updatedBy = user;
  data[formId].unshift(record);
  saveData(data);
  return record;
}
async function updateRecord(formId, id, updated){
  const data = loadData();
  const list = data[formId] || [];
  const idx = list.findIndex(r => r.id === id);
  if(idx > -1){
    const user = await ensureCurrentUser();
    updated.id = id;
    updated.createdAt = list[idx].createdAt;
    updated.createdBy = list[idx].createdBy || user;
    updated.updatedAt = new Date().toISOString();
    updated.updatedBy = user;
    list[idx] = updated;
    saveData(data);
  }
  return updated;
}
function deleteRecord(formId, id){
  const data = loadData();
  data[formId] = (data[formId] || []).filter(r => r.id !== id);
  saveData(data);
}
function isFlagged(formId, record){
  const def = FORMS[formId];
  return def.fields.some(f => f.flagIf && f.flagIf.includes(record[f.key]));
}

/* ---------------------------------------------------------
   FLAG NOTIFICATIONS
--------------------------------------------------------- */
function getAllFlaggedRecords(){
  const out = [];
  Object.keys(FORMS).forEach(formId => {
    getRecords(formId).forEach(r => {
      if(isFlagged(formId, r)) out.push({formId, record: r});
    });
  });
  return out;
}
function getUnackedFlagCount(){
  return getAllFlaggedRecords().filter(x => !x.record.__acked).length;
}
function ackAllFlags(){
  const data = loadData();
  Object.keys(data).forEach(formId => {
    (data[formId] || []).forEach(r => {
      if(isFlagged(formId, r)) r.__acked = true;
    });
  });
  saveData(data);
}

/* ---------------------------------------------------------
   UI MODALS — replace native prompt()/confirm()/alert().
   Google Sites embeds this page inside a sandboxed cross-origin iframe,
   and sandboxed iframes block or silently no-op native dialogs (the
   symptom is exactly "clicking + Add New does nothing" / "no popup
   appears to type into"). These custom, Promise-based modals work
   everywhere, including inside that sandbox.
--------------------------------------------------------- */
function closeAppModal(overlay){
  if(overlay && overlay.parentNode) overlay.parentNode.removeChild(overlay);
}
function showAppPrompt(message, defaultValue){
  return new Promise(resolve => {
    const overlay = document.createElement("div");
    overlay.className = "app-modal-overlay";
    overlay.innerHTML = `
      <div class="app-modal">
        <div class="app-modal-msg">${escapeHtml(message)}</div>
        <input type="text" class="app-modal-input" value="${escapeHtml(defaultValue || "")}">
        <div class="app-modal-actions">
          <button type="button" class="btn btn-secondary btn-small app-modal-cancel">Cancel</button>
          <button type="button" class="btn btn-primary btn-small app-modal-ok">OK</button>
        </div>
      </div>`;
    document.body.appendChild(overlay);
    const input = overlay.querySelector(".app-modal-input");
    input.focus();
    input.select();
    function finish(result){ closeAppModal(overlay); resolve(result); }
    overlay.querySelector(".app-modal-ok").addEventListener("click", () => finish(input.value));
    overlay.querySelector(".app-modal-cancel").addEventListener("click", () => finish(null));
    input.addEventListener("keydown", e => {
      if(e.key === "Enter"){ e.preventDefault(); finish(input.value); }
      if(e.key === "Escape"){ e.preventDefault(); finish(null); }
    });
    overlay.addEventListener("click", e => { if(e.target === overlay) finish(null); });
  });
}
function showAppConfirm(message){
  return new Promise(resolve => {
    const overlay = document.createElement("div");
    overlay.className = "app-modal-overlay";
    overlay.innerHTML = `
      <div class="app-modal">
        <div class="app-modal-msg">${escapeHtml(message)}</div>
        <div class="app-modal-actions">
          <button type="button" class="btn btn-secondary btn-small app-modal-cancel">Cancel</button>
          <button type="button" class="btn btn-primary btn-small app-modal-ok">OK</button>
        </div>
      </div>`;
    document.body.appendChild(overlay);
    function finish(result){ closeAppModal(overlay); resolve(result); }
    overlay.querySelector(".app-modal-ok").addEventListener("click", () => finish(true));
    overlay.querySelector(".app-modal-cancel").addEventListener("click", () => finish(false));
    overlay.addEventListener("click", e => { if(e.target === overlay) finish(false); });
    document.addEventListener("keydown", function esc(e){
      if(e.key === "Escape"){ finish(false); document.removeEventListener("keydown", esc); }
    });
  });
}
function showAppAlert(message){
  return new Promise(resolve => {
    const overlay = document.createElement("div");
    overlay.className = "app-modal-overlay";
    overlay.innerHTML = `
      <div class="app-modal">
        <div class="app-modal-msg">${escapeHtml(message)}</div>
        <div class="app-modal-actions">
          <button type="button" class="btn btn-primary btn-small app-modal-ok">OK</button>
        </div>
      </div>`;
    document.body.appendChild(overlay);
    function finish(){ closeAppModal(overlay); resolve(); }
    overlay.querySelector(".app-modal-ok").addEventListener("click", finish);
    overlay.addEventListener("click", e => { if(e.target === overlay) finish(); });
  });
}

async function handleListFieldChange(selectEl, listType){
  if(selectEl.value === "__add_new__"){
    const label = listType === "suppliers" ? "supplier" : "material";
    const val = await showAppPrompt(`Add new ${label}:`);
    if(val && val.trim()){
      const trimmed = val.trim();
      const lists = loadLists();
      if(!lists[listType].includes(trimmed)) lists[listType].push(trimmed);
      saveLists(lists);
      const items = lists[listType].slice().sort();
      selectEl.innerHTML = `<option value="">Select...</option>` +
        items.map(i => `<option value="${escapeHtml(i)}" ${i===trimmed?"selected":""}>${escapeHtml(i)}</option>`).join("") +
        `<option value="__add_new__">+ Add New...</option>`;
    } else {
      selectEl.value = "";
    }
  }
}

/* ---------------------------------------------------------
   ROUTER
--------------------------------------------------------- */
// Bumped every time render() runs (i.e. every navigation). Async work that
// started on one page (like fetching the central sheet) captures this value
// and checks it before touching the DOM once it resolves — if the user has
// since navigated to a different page, the DOM elements that async work
// expects no longer exist, so it must skip its update instead of throwing
// "Cannot set properties of null" against a page that isn't showing anymore.
let renderGeneration = 0;
function parseHash(){
  const h = location.hash.replace(/^#\/?/, "");
  const parts = h.split("/").filter(Boolean);
  return parts;
}
window.addEventListener("hashchange", render);
window.addEventListener("DOMContentLoaded", () => {
  // Build marker — check this in the browser console (F12) to confirm which
  // version of the code is actually live vs. cached by Google Sites/browser.
  console.log("Kenzen QA app build: 2026-08-12-pdf-signature-fix-2");
  if(!location.hash) location.hash = "#/dashboard";
  render();
});

function navigate(hash){ location.hash = hash; }

/* ---------------------------------------------------------
   SIDEBAR
--------------------------------------------------------- */
function renderSidebar(){
  const parts = parseHash();
  const current = parts.join("/");
  const unacked = getUnackedFlagCount();
  let html = `<div class="nav-section">
    <div class="nav-link ${current === 'dashboard' ? 'active' : ''}" onclick="navigate('#/dashboard')">Dashboard${unacked ? ` <span class="nav-badge">${unacked}</span>` : ""}</div>
    <div class="nav-link nav-link-highlight ${current === 'qcmaster' ? 'active' : ''}" onclick="navigate('#/qcmaster')">🗂 QC Master Data</div>
    <div class="nav-link ${current === 'search' ? 'active' : ''}" onclick="navigate('#/search')">Cross-Form Search</div>
    <div class="nav-link nav-link-highlight ${current === 'compile' ? 'active' : ''}" onclick="navigate('#/compile')">📊 Compile All Reports</div>
  </div>`;

  html += `<div class="nav-section"><div class="nav-section-title">QA Forms</div>`;
  Object.keys(FORMS).forEach(formId => {
    const isActiveNew = current === `form/${formId}/new`;
    const isActiveList = current === `form/${formId}/records`;
    html += `<div class="nav-link ${isActiveNew || isActiveList ? 'active' : ''}" style="cursor:default;">${FORMS[formId].short}</div>
      <div class="nav-sub ${isActiveNew ? 'active' : ''}" onclick="navigate('#/form/${formId}/new')">+ New Entry</div>
      <div class="nav-sub ${isActiveList ? 'active' : ''}" onclick="navigate('#/form/${formId}/records')">View Records</div>`;
  });
  html += `</div>`;

  html += `<div class="nav-section">
    <div class="nav-section-title">Data</div>
    <div class="nav-sub ${current === 'lists' ? 'active' : ''}" onclick="navigate('#/lists')">Manage Supplier/Material Lists</div>
    <div class="nav-sub ${current === 'setup' ? 'active' : ''}" onclick="navigate('#/setup')">Central Sheet Setup</div>
    <div class="nav-sub" onclick="exportAllJSON()">Backup (Export All)</div>
    <div class="nav-sub" onclick="document.getElementById('importFile').click()">Restore (Import)</div>
  </div>
  <input type="file" id="importFile" accept=".json" style="display:none" onchange="importAllJSON(event)">`;

  document.getElementById("nav").innerHTML = html;
}

--------------------------------------------------------- */
function render(){
  renderGeneration++;
  renderSidebar();
  const parts = parseHash();
  const main = document.getElementById("main");

  if(parts[0] === "dashboard" || parts.length === 0){
    main.innerHTML = renderDashboard();
    ackAllFlags();
    return;
  }
  if(parts[0] === "search"){
    main.innerHTML = renderSearchPage();
    attachSearchHandlers();
    return;
  }
  if(parts[0] === "lists"){
    main.innerHTML = renderListsPage();
    attachListsHandlers();
    return;
  }
  if(parts[0] === "compile"){
    main.innerHTML = renderCompilePage();
    attachCompileHandlers();
    return;
  }
  if(parts[0] === "qcmaster"){
    main.innerHTML = renderQCMasterPage();
    attachQCMasterHandlers();
    return;
  }
  if(parts[0] === "setup"){
    main.innerHTML = renderCentralSetupPage();
    attachCentralSetupHandlers();
    return;
  }
  if(parts[0] === "form" && parts[1] && FORMS[parts[1]]){
    const formId = parts[1];
    if(parts[2] === "new"){ main.innerHTML = renderFormEntry(formId, null); attachFormHandler(formId, null); return; }
    if(parts[2] === "edit" && parts[3]){ main.innerHTML = renderFormEntry(formId, parts[3]); attachFormHandler(formId, parts[3]); return; }
    if(parts[2] === "records"){ main.innerHTML = renderRecordsList(formId); attachRecordsHandlers(formId); return; }
  }
  main.innerHTML = renderDashboard();
}

function renderDashboard(){
  let statsHtml = "";
  let flaggedRows = [];
  Object.keys(FORMS).forEach(formId => {
    const records = getRecords(formId);
    const flaggedCount = records.filter(r => isFlagged(formId, r)).length;
    statsHtml += `
      <div class="stat-card ${flaggedCount ? 'flagged' : ''}">
        <div class="num">${records.length}</div>
        <div class="label">${FORMS[formId].short}${flaggedCount ? ` &middot; ${flaggedCount} flagged` : ""}</div>
      </div>`;
    records.slice(0,5).forEach(r => {
      if(isFlagged(formId, r)) flaggedRows.push({formId, record: r});
    });
  });

  flaggedRows.sort((a,b) => new Date(b.record.createdAt) - new Date(a.record.createdAt));
  let flaggedHtml = flaggedRows.length
    ? flaggedRows.slice(0,8).map(({formId, record}) => `
        <tr class="flagged">
          <td>${FORMS[formId].short}</td>
          <td>${record.date || "-"}</td>
          <td>${escapeHtml(summarizeRecord(formId, record))}</td>
          <td><span class="btn btn-secondary btn-small" onclick="navigate('#/form/${formId}/records')">View</span></td>
        </tr>`).join("")
    : `<tr><td colspan="4" class="empty-state">No flagged items right now.</td></tr>`;

  return `
    <h2>Dashboard</h2>
    <div class="subtitle">Overview of all warehouse QA records stored on this device.</div>
    <div class="grid-cards">${statsHtml}</div>
    <div class="card">
      <h3 style="margin-top:0;font-size:15px;">Recent flagged items</h3>
      <table>
        <thead><tr><th>Form</th><th>Date</th><th>Summary</th><th></th></tr></thead>
        <tbody>${flaggedHtml}</tbody>
      </table>
    </div>
  `;
}

function summarizeRecord(formId, record){
  const def = FORMS[formId];
  const key = def.fields.find(f => f.key !== "date")?.key;
  return key ? (record[key] || "") : "";
}

function attachSearchHandlers(){
  const box = document.getElementById("globalSearchBox");
  document.getElementById("globalSearchResults").innerHTML =
    `<div class="empty-state">Start typing to search across all ${Object.keys(FORMS).length} forms.</div>`;
  box.addEventListener("input", () => runGlobalSearch(box.value));
  box.focus();

function runGlobalSearch(query){
  const resultsEl = document.getElementById("globalSearchResults");
  const q = query.trim().toLowerCase();
  if(!q){
    resultsEl.innerHTML = `<div class="empty-state">Start typing to search across all ${Object.keys(FORMS).length} forms.</div>`;
    return;
  }
  let matches = [];
  Object.keys(FORMS).forEach(formId => {
    const def = FORMS[formId];
    getRecords(formId).forEach(r => {
      for(const f of def.fields){
        const val = r[f.key];
        if(val && String(val).toLowerCase().includes(q)){
          matches.push({formId, record: r, field: f.label, value: String(val)});
          break;
        }
      }
    });
  });
  matches.sort((a,b) => new Date(b.record.createdAt) - new Date(a.record.createdAt));
  resultsEl.innerHTML = matches.length
    ? `<table>
        <thead><tr><th>Form</th><th>Date</th><th>Matched Field</th><th>Value</th><th>Status</th><th></th></tr></thead>
        <tbody>
          ${matches.map(m => `
            <tr class="${isFlagged(m.formId, m.record) ? 'flagged' : ''}">
              <td>${FORMS[m.formId].short}</td>
              <td>${m.record.date || "-"}</td>
              <td>${escapeHtml(m.field)}</td>
              <td>${escapeHtml(m.value)}</td>
              <td>${isFlagged(m.formId, m.record) ? '<span class="badge badge-flag">Flag</span>' : '<span class="badge badge-ok">OK</span>'}</td>
              <td><span class="btn btn-secondary btn-small" onclick="navigate('#/form/${m.formId}/edit/${m.record.id}')">Open</span></td>
            </tr>`).join("")}
        </tbody>
      </table>`
    : `<div class="empty-state">No matches found across any form.</div>`;
}

function addListItemFromInput(listType, inputId, containerId){
  const input = document.getElementById(inputId);
  const val = input.value.trim();
  if(!val) return;
  const lists = loadLists();
  if(!lists[listType]) lists[listType] = [];
  if(!lists[listType].includes(val)) lists[listType].push(val);
  saveLists(lists);
  input.value = "";
  renderChips(listType, containerId);
}

function removeListItem(listType, val){
  const lists = loadLists();
  lists[listType] = (lists[listType] || []).filter(x => x !== val);
  saveLists(lists);
}

/* ---------------------------------------------------------
   CENTRAL SHEET SYNC (Google Apps Script relay — no OAuth popup,
   works even inside a Google Sites embed)
--------------------------------------------------------- */
function getAppsScriptUrl(){ return localStorage.getItem("kenzenQA_appscript_url") || ""; }
function setAppsScriptUrl(url){ localStorage.setItem("kenzenQA_appscript_url", url); }

const MASTER_COLUMNS = ["Record ID","Report Type","Inspection Date","Material Code","Material Name","Product Name",
  "Quantity","Supplier","Sample Size","Inspector Name","Overall Status","Created By","Created At","Updated By","Updated At"];

const MASTER_ALIASES = {
  "Material Code": ["materialCode"],
  "Material Name": ["materialName","material"],
  "Product Name": ["productName"],
  "Quantity": ["quantity","qty"],
  "Supplier": ["supplier","vendor","vendorName"],
  "Sample Size": ["sampleSize"],
  "Inspector Name": ["inspectorName","inspectedBy","verifiedBy","approvedBy","recordedBy","performedBy"],
  "Overall Status": ["overallStatus","approvedRejected","overallAcceptability","overallAcceptance","status","disposition","withinRange","withinSpec"]
};

function resolveMasterField(record, col){
  const aliases = MASTER_ALIASES[col];
  if(!aliases) return "";
  for(const key of aliases){
    if(record[key] !== undefined && record[key] !== null && record[key] !== "") return record[key];
  }
  return "";
}

function buildMasterRow(formId, record){
  const def = FORMS[formId];
  const row = {
    "Record ID": record.id,
    "Report Type": def.short,
    "Inspection Date": record.date || "",
    "Created By": record.createdBy || "",
    "Created At": record.createdAt || "",
    "Updated By": record.updatedBy || "",
    "Updated At": record.updatedAt || ""
  };
  MASTER_COLUMNS.forEach(col => {
    if(row[col] === undefined) row[col] = resolveMasterField(record, col);
  });
  return row;
}

function buildLocalMasterRows(){
  const rows = [];
  Object.keys(FORMS).forEach(formId => {
    getRecords(formId).forEach(r => {
      const row = buildMasterRow(formId, r);
      row.__formId = formId;
      row.__recordId = r.id;
      rows.push(row);
    });
  });
  return rows;
}

async function fetchCentralData(){
  const url = getAppsScriptUrl();
  if(!url) return null;
  const res = await fetch(url, { method: "GET" });
  if(!res.ok) throw new Error(`Central sheet fetch failed (${res.status})`);
  return res.json();
}

async function syncRecordToCentral(formId, record){
  const url = getAppsScriptUrl();
  if(!url) return; // not connected yet — local save already succeeded, nothing lost
  try{
    const row = buildMasterRow(formId, record);
    await fetch(url, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" }, // avoids CORS preflight against Apps Script
      body: JSON.stringify({ action: "upsert", record: row, columns: MASTER_COLUMNS })
    });
    showToast("Synced to central sheet ✓");
  }catch(err){
    console.error(err);
    showToast("Saved locally — central sync failed, retry from QC Master Data", true);
  }
}

async function syncAllToCentral(){
  let url = getAppsScriptUrl();
  if(!url){
    const entered = ((await showAppPrompt('Paste your Apps Script Web App URL (see the Central Sheet Setup instructions):')) || "").trim();
    if(!entered) return;
    setAppsScriptUrl(entered);
    url = entered;
  }
  const rows = buildLocalMasterRows();
  if(!rows.length){ showToast("No local records to sync"); return; }
  updateStatusEl("masterStatus", `Syncing ${rows.length} record(s) to Google Sheets...`);
  try{
    await fetch(url, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ action: "bulkUpsert", records: rows, columns: MASTER_COLUMNS })
    });
    updateStatusEl("masterStatus", "");
    showToast(`Synced ${rows.length} record(s) to the central Google Sheet ✓`);
  }catch(err){
    console.error(err);
    updateStatusEl("masterStatus", "");
    await showAppAlert("Sync failed: " + (err.message || err));
  }
}

function updateStatusEl(id, msg){
  const el = document.getElementById(id);
  if(el) el.textContent = msg;
}

let masterDataRows = [];
let masterDataSource = "local";
let masterSearchQuery = "";
let masterSortCol = "Inspection Date";
let masterSortDir = "desc";
let masterPage = 1;
const MASTER_PAGE_SIZE = 50;
let masterFilters = { materialCode:"", materialName:"", supplier:"", inspector:"", status:"", dateFrom:"", dateTo:"" };

function renderQCMasterPage(){
  return `
    <h2>QC Master Data</h2>
    <div class="subtitle">Every QC inspection record in one place — the centralized source for tracking, filtering, and reporting.</div>
    <div class="card">

        </div>

function attachQCMasterHandlers(){
  masterDataRows = buildLocalMasterRows();
  masterDataSource = "local";

  renderMasterTable();

  document.getElementById("refreshMasterBtn").addEventListener("click", loadCentralIntoMaster);
  document.getElementById("masterSearchBox").addEventListener("input", (e) => {
    masterSearchQuery = e.target.value; masterPage = 1; renderMasterTable();
  });
  document.getElementById("masterExportExcelBtn").addEventListener("click", () =>
    exportCompiledExcel({ columns: MASTER_COLUMNS, rows: getFilteredMasterRows() }));
  document.getElementById("masterExportCsvBtn").addEventListener("click", () =>
    exportCompiledCSV({ columns: MASTER_COLUMNS, rows: getFilteredMasterRows() }));
  document.getElementById("masterSyncBtn").addEventListener("click", syncAllToCentral);

  if(getAppsScriptUrl()) loadCentralIntoMaster();
}

function updateMasterSourceLabel(){
  const el = document.getElementById("masterSourceLabel");
  if(!el) return;
  if(masterDataSource === "central"){
    el.textContent = `Showing ${masterDataRows.length} records — merged from this device and the shared central sheet.`;
  } else if(getAppsScriptUrl()){
    el.textContent = `Showing ${masterDataRows.length} records from this device — fetching central sheet...`;
  } else {
    el.textContent = `Showing ${masterDataRows.length} records from this device. Central sheet not connected yet — see "Central Sheet Setup."`;
  }
}

function renderMasterFilters(){
  const container = document.getElementById("masterFilterRow");
  if(!container) return;
  const distinct = (col) => Array.from(new Set(masterDataRows.map(r => r[col]).filter(Boolean))).sort();
  const selectHtml = (id, label, options) => `
    <div class="field" style="margin-bottom:0;">
      <label style="font-size:11.5px;">${label}</label>
      <select id="${id}">
        <option value="">All</option>
        ${options.map(o => `<option value="${escapeHtml(o)}">${escapeHtml(o)}</option>`).join("")}
      </select>
    </div>`;

  container.innerHTML = `
    ${selectHtml("filterMaterialCode","Material Code", distinct("Material Code"))}
    ${selectHtml("filterMaterialName","Material Name", distinct("Material Name"))}
    ${selectHtml("filterSupplier","Supplier", distinct("Supplier"))}
    ${selectHtml("filterInspector","Inspector", distinct("Inspector Name"))}
    ${selectHtml("filterStatus","Overall Status", distinct("Overall Status"))}
    <div class="field" style="margin-bottom:0;"><label style="font-size:11.5px;">Date From</label><input type="date" id="filterDateFrom"></div>
    <div class="field" style="margin-bottom:0;"><label style="font-size:11.5px;">Date To</label><input type="date" id="filterDateTo"></div>
  `;

  const bind = (id, key) => document.getElementById(id).addEventListener("change", (e) => {
    masterFilters[key] = e.target.value; masterPage = 1; renderMasterTable();
  });
  bind("filterMaterialCode","materialCode");
  bind("filterMaterialName","materialName");
  bind("filterSupplier","supplier");
  bind("filterInspector","inspector");
  bind("filterStatus","status");
  bind("filterDateFrom","dateFrom");
  bind("filterDateTo","dateTo");
}

function getFilteredMasterRows(){
  let rows = masterDataRows.slice();
  if(masterFilters.materialCode) rows = rows.filter(r => r["Material Code"] === masterFilters.materialCode);
  if(masterFilters.materialName) rows = rows.filter(r => r["Material Name"] === masterFilters.materialName);
  if(masterFilters.supplier) rows = rows.filter(r => r["Supplier"] === masterFilters.supplier);
  if(masterFilters.inspector) rows = rows.filter(r => r["Inspector Name"] === masterFilters.inspector);
  if(masterFilters.status) rows = rows.filter(r => r["Overall Status"] === masterFilters.status);
  if(masterFilters.dateFrom) rows = rows.filter(r => r["Inspection Date"] && r["Inspection Date"] >= masterFilters.dateFrom);
  if(masterFilters.dateTo) rows = rows.filter(r => r["Inspection Date"] && r["Inspection Date"] <= masterFilters.dateTo);
  if(masterSearchQuery){
    const q = masterSearchQuery.toLowerCase();
    rows = rows.filter(r => MASTER_COLUMNS.some(c => String(r[c] ?? "").toLowerCase().includes(q)));
  }
  rows.sort((a,b) => {
    const av = String(a[masterSortCol] ?? ""), bv = String(b[masterSortCol] ?? "");
    const cmp = av.localeCompare(bv, undefined, { numeric: true });
    return masterSortDir === "asc" ? cmp : -cmp;
  });
  return rows;
}

function setMasterSort(col){
  if(masterSortCol === col){ masterSortDir = masterSortDir === "asc" ? "desc" : "asc"; }
  else { masterSortCol = col; masterSortDir = "asc"; }
  renderMasterTable();
}

function renderMasterTable(){
  // Defensive: only meaningful if the QC Master Data page is actually the
  // one currently rendered. Guards against a delayed async call (e.g. a
  // slow central-sheet fetch) landing after the user has navigated away.
  const head = document.getElementById("masterTableHead");
  const body = document.getElementById("masterTableBody");
  const pag = document.getElementById("masterPaginationRow");
  if(!head || !body || !pag) return;

  const filtered = getFilteredMasterRows();
  const totalPages = Math.max(1, Math.ceil(filtered.length / MASTER_PAGE_SIZE));
  if(masterPage > totalPages) masterPage = totalPages;
  const pageRows = filtered.slice((masterPage-1)*MASTER_PAGE_SIZE, masterPage*MASTER_PAGE_SIZE);

  head.innerHTML = `<tr>${MASTER_COLUMNS.map(c =>
    `<th style="cursor:pointer;" onclick="setMasterSort('${c}')">${escapeHtml(c)}${masterSortCol===c ? (masterSortDir==='asc'?' ▲':' ▼') : ''}</th>`
  ).join("")}<th>Actions</th></tr>`;

  body.innerHTML = pageRows.length ? pageRows.map(r => `
    <tr class="${/reject|fail|not ok|no|open/i.test(r["Overall Status"] || "") ? 'flagged' : ''}">
      ${MASTER_COLUMNS.map(c => `<td>${escapeHtml(String(r[c] ?? ""))}</td>`).join("")}
      <td style="white-space:nowrap;">
        ${r.__formId ? `
          <span class="btn btn-secondary btn-small" onclick="navigate('#/form/${r.__formId}/edit/${r.__recordId}')">Edit</span>
          <span class="btn btn-secondary btn-small" onclick="generatePDF('${r.__formId}','${r.__recordId}')">PDF</span>
          <span class="btn btn-danger btn-small" onclick="handleDelete('${r.__formId}','${r.__recordId}')">Delete</span>
        ` : `<span class="subtitle" style="margin:0;">Not on this device</span>`}
      </td>
    </tr>`).join("") : `<tr><td colspan="${MASTER_COLUMNS.length+1}" class="empty-state">No QC records match these filters.</td></tr>`;

  pag.innerHTML = `
    <div class="subtitle" style="margin:0;">Showing ${pageRows.length ? ((masterPage-1)*MASTER_PAGE_SIZE+1):0}–${(masterPage-1)*MASTER_PAGE_SIZE+pageRows.length} of ${filtered.length}</div>
    <div class="btn-row" style="margin-top:0;">
      <button type="button" class="btn btn-secondary btn-small" id="masterPrevBtn" ${masterPage<=1?"disabled":""}>Prev</button>
      <span class="subtitle" style="margin:0;align-self:center;">Page ${masterPage} / ${totalPages}</span>
      <button type="button" class="btn btn-secondary btn-small" id="masterNextBtn" ${masterPage>=totalPages?"disabled":""}>Next</button>
    </div>`;
  document.getElementById("masterPrevBtn")?.addEventListener("click", () => { masterPage--; renderMasterTable(); });
  document.getElementById("masterNextBtn")?.addEventListener("click", () => { masterPage++; renderMasterTable(); });
}

async function loadCentralIntoMaster(){
  // Captured so this can tell, once its awaited work finishes, whether the
  // user is still on the QC Master Data page. If they've navigated
  // elsewhere in the meantime, this page's DOM elements are gone — updating
  // them (or even popping an alert) would be wrong, so this bails out quietly.
  const myGeneration = renderGeneration;
  const url = getAppsScriptUrl();
  if(!url){
    if(renderGeneration !== myGeneration) return;
    await showAppAlert('Connect a central Google Sheet first — see "Central Sheet Setup" in the sidebar.');
    return;
  }
  updateStatusEl("masterStatus", "Loading from central sheet...");
  try{
    const data = await fetchCentralData();
    if(renderGeneration !== myGeneration) return;
    const centralRows = (data && data.rows ? data.rows : []).map(row => {
      row.__formId = null;
      row.__recordId = row["Record ID"];
      return row;
    });
    const localRows = buildLocalMasterRows();
    const localIds = new Set(localRows.map(r => r["Record ID"]));
    const centralOnly = centralRows.filter(r => !localIds.has(r["Record ID"]));
    masterDataRows = localRows.concat(centralOnly);
    masterDataSource = "central";
    updateMasterSourceLabel();
    updateStatusEl("masterStatus", "");
    renderMasterFilters();
    renderMasterTable();
    showToast(`Loaded ${masterDataRows.length} record(s) — ${centralOnly.length} from other devices`);
  }catch(err){
    console.error(err);
    if(renderGeneration !== myGeneration) return;
    updateStatusEl("masterStatus", "");
    await showAppAlert("Could not load the central sheet: " + (err.message || err));
  }
}

let compiledDataset = null;
let compileSearchQuery = "";
let compilePage = 1;
let lastCompileSelection = [];
const COMPILE_PAGE_SIZE = 50;

function renderCompilePage(){

function updateCompileStatus(msg){
  const el = document.getElementById("compileStatus");
  if(el) el.textContent = msg;
}

function buildMasterDataset(selectedFormIds){
  const columnsOrder = ["Report Type", "Record ID", "Date"];
  const seenCols = new Set(columnsOrder);
  const failedForms = [];

  selectedFormIds.forEach(formId => {
    try{
      FORMS[formId].fields.forEach(f => {
        if(f.key === "date") return;
        if(!seenCols.has(f.label)){ seenCols.add(f.label); columnsOrder.push(f.label); }
      });
    }catch(e){ if(!failedForms.includes(formId)) failedForms.push(formId); }
  });
  columnsOrder.push("Photos Attached");

  const rows = [];
  selectedFormIds.forEach(formId => {
    const def = FORMS[formId];
    let records;
    try{
      records = getRecords(formId);
    }catch(e){
      if(!failedForms.includes(formId)) failedForms.push(formId);
      return;
    }
    records.forEach(r => {
      const row = { "Report Type": def.short, "Record ID": r.id, "Date": r.date || "" };
      def.fields.forEach(f => {
        if(f.key === "date") return;
        row[f.label] = (r[f.key] === undefined || r[f.key] === null) ? "" : r[f.key];
      });
      row["Photos Attached"] = (r.__images || []).length;
      rows.push(row);
    });
  });

  return { columns: columnsOrder, rows, failedForms };
}

function findDuplicateRowIndexes(dataset){
  const seen = new Map();
  const dups = [];
  dataset.rows.forEach((row, idx) => {
    const key = dataset.columns.filter(c => c !== "Record ID").map(c => String(row[c] ?? "")).join("§");
    if(seen.has(key)) dups.push(idx);
    else seen.set(key, idx);
  });
  return dups;
}

function getFilteredCompileRows(){
  if(!compiledDataset) return [];
  if(!compileSearchQuery) return compiledDataset.rows;
  const q = compileSearchQuery.toLowerCase();
  return compiledDataset.rows.filter(row => compiledDataset.columns.some(c => String(row[c] ?? "").toLowerCase().includes(q)));
}

function runCompile(selectedFormIds){
  lastCompileSelection = selectedFormIds;
  updateCompileStatus("Compiling...");
  setTimeout(() => {
    compiledDataset = buildMasterDataset(selectedFormIds);
    compileSearchQuery = "";
    compilePage = 1;
    updateCompileStatus(`Compiled ${selectedFormIds.length} report type${selectedFormIds.length===1?"":"s"} → 1 master dataset`);
    renderCompileResults();
  }, 30);
}

function renderCompileResults(){
  const section = document.getElementById("compileResultsSection");
  if(!compiledDataset){ section.innerHTML = ""; return; }

  const failedBanner = compiledDataset.failedForms && compiledDataset.failedForms.length
    ? `<div class="banner-warning">
        <span>⚠ Failed to compile: ${compiledDataset.failedForms.map(id => escapeHtml(FORMS[id] ? FORMS[id].short : id)).join(", ")}</span>
        <button type="button" class="btn btn-secondary btn-small" id="retryFailedBtn">Retry Failed</button>
      </div>`
    : "";

  if(!compiledDataset.rows.length){
    section.innerHTML = `${failedBanner}<div class="card"><div class="empty-state">No records found in the selected report types.</div></div>`;
    document.getElementById("retryFailedBtn")?.addEventListener("click", () => runCompile(lastCompileSelection));
    return;
  }

  const totalRecords = compiledDataset.rows.length;
  const reportTypeCount = new Set(compiledDataset.rows.map(r => r["Report Type"])).size;
  const dupIndexes = findDuplicateRowIndexes(compiledDataset);
  const filtered = getFilteredCompileRows();
  const totalPages = Math.max(1, Math.ceil(filtered.length / COMPILE_PAGE_SIZE));
  if(compilePage > totalPages) compilePage = totalPages;
  const pageRows = filtered.slice((compilePage-1)*COMPILE_PAGE_SIZE, compilePage*COMPILE_PAGE_SIZE);

  section.innerHTML = `
    ${failedBanner}
    <div class="grid-cards">
      <div class="stat-card"><div class="num">${totalRecords}</div><div class="label">Records Compiled</div></div>
      <div class="stat-card"><div class="num">${reportTypeCount}</div><div class="label">Report Types</div></div>
      <div class="stat-card ${dupIndexes.length ? 'flagged' : ''}"><div class="num">${dupIndexes.length}</div><div class="label">Possible Duplicate Rows</div></div>
    </div>
    <div class="card">
      <div class="toolbar">
        <input type="search" id="compileSearchBox" placeholder="Search compiled data..." value="${escapeHtml(compileSearchQuery)}">
        <div class="btn-row" style="margin-top:0;">
          ${dupIndexes.length ? `<button type="button" class="btn btn-danger btn-small" id="removeDupBtn">Remove ${dupIndexes.length} Duplicate Row${dupIndexes.length===1?"":"s"}</button>` : ""}
          <button type="button" class="btn btn-secondary btn-small" id="exportExcelBtn">Download Excel</button>
          <button type="button" class="btn btn-secondary btn-small" id="exportCsvBtn">Download CSV</button>
          <button type="button" class="btn btn-primary btn-small" id="exportSheetsBtn">Export to Google Sheets</button>
        </div>
      </div>
      <div style="overflow-x:auto;">
        <table id="compileTable">
          <thead><tr>${compiledDataset.columns.map(c => `<th>${escapeHtml(c)}</th>`).join("")}</tr></thead>
          <tbody>
            ${pageRows.map(row => `<tr>${compiledDataset.columns.map(c => `<td>${escapeHtml(String(row[c] ?? ""))}</td>`).join("")}</tr>`).join("")}
          </tbody>
        </table>
      </div>
      <div class="toolbar" style="margin-top:14px;">
        <div class="subtitle" style="margin:0;">Showing ${pageRows.length ? ((compilePage-1)*COMPILE_PAGE_SIZE+1) : 0}–${(compilePage-1)*COMPILE_PAGE_SIZE + pageRows.length} of ${filtered.length}</div>
        <div class="btn-row" style="margin-top:0;">
          <button type="button" class="btn btn-secondary btn-small" id="prevPageBtn" ${compilePage<=1?"disabled":""}>Prev</button>
          <span class="subtitle" style="margin:0;align-self:center;">Page ${compilePage} / ${totalPages}</span>
          <button type="button" class="btn btn-secondary btn-small" id="nextPageBtn" ${compilePage>=totalPages?"disabled":""}>Next</button>
        </div>
      </div>
    </div>
  `;

  document.getElementById("retryFailedBtn")?.addEventListener("click", () => runCompile(lastCompileSelection));
  document.getElementById("compileSearchBox").addEventListener("input", (e) => {
    compileSearchQuery = e.target.value;
    compilePage = 1;
    renderCompileResults();
  });
  document.getElementById("prevPageBtn")?.addEventListener("click", () => { compilePage--; renderCompileResults(); });
  document.getElementById("nextPageBtn")?.addEventListener("click", () => { compilePage++; renderCompileResults(); });
  document.getElementById("removeDupBtn")?.addEventListener("click", () => {
    const idxSet = new Set(findDuplicateRowIndexes(compiledDataset));
    compiledDataset.rows = compiledDataset.rows.filter((_, idx) => !idxSet.has(idx));
    showToast(`Removed ${idxSet.size} duplicate row(s)`);
    renderCompileResults();
  });
  document.getElementById("exportExcelBtn").addEventListener("click", () => exportCompiledExcel(compiledDataset));
  document.getElementById("exportCsvBtn").addEventListener("click", () => exportCompiledCSV(compiledDataset));
  document.getElementById("exportSheetsBtn").addEventListener("click", () => exportToGoogleSheets(compiledDataset));
}

async function exportCompiledExcel(dataset){

function exportCompiledCSV(dataset){

  downloadFile(`kenzen_compiled_reports_${new Date().toISOString().slice(0,10)}.csv`, csv, "text/csv");
}

/* ---------------------------------------------------------
   GOOGLE SHEETS EXPORT (client-side OAuth, Sheets API v4)
--------------------------------------------------------- */
const GOOGLE_SHEETS_SCOPE = "https://www.googleapis.com/auth/spreadsheets";
let googleAccessToken = null;
let googleTokenClient = null;

function getGoogleClientId(){ return localStorage.getItem("kenzenQA_google_client_id") || ""; }
function setGoogleClientId(id){ localStorage.setItem("kenzenQA_google_client_id", id); }
function getLastSpreadsheetId(){ return localStorage.getItem("kenzenQA_last_sheet_id") || ""; }
function setLastSpreadsheetId(id){ localStorage.setItem("kenzenQA_last_sheet_id", id); }
function getSyncedIds(spreadsheetId){
  try{
    const raw = localStorage.getItem("kenzenQA_sheet_sync_" + spreadsheetId);
    return raw ? new Set(JSON.parse(raw)) : new Set();
  }catch(e){ return new Set(); }
}
function saveSyncedIds(spreadsheetId, idsSet){
  localStorage.setItem("kenzenQA_sheet_sync_" + spreadsheetId, JSON.stringify(Array.from(idsSet)));
}

function ensureGoogleAuth(){
  return new Promise((resolve, reject) => {
    const clientId = getGoogleClientId();
    if(!clientId){ reject(new Error("NO_CLIENT_ID")); return; }
    if(typeof google === "undefined" || !google.accounts || !google.accounts.oauth2){ reject(new Error("GIS_NOT_LOADED")); return; }
    googleTokenClient = google.accounts.oauth2.initTokenClient({
      client_id: clientId,
      scope: GOOGLE_SHEETS_SCOPE,
      callback: (resp) => {
        if(resp.error){ reject(new Error(resp.error)); return; }
        googleAccessToken = resp.access_token;
        resolve(googleAccessToken);
      }
    });
    googleTokenClient.requestAccessToken();
  });
}

async function sheetsApiFetch(path, options){
  const res = await fetch(`https://sheets.googleapis.com/v4/spreadsheets${path}`, Object.assign({}, options, {
    headers: Object.assign({
      "Authorization": `Bearer ${googleAccessToken}`,
      "Content-Type": "application/json"
    }, (options && options.headers) || {})
  }));
  if(!res.ok){
    let msg = `Sheets API error (${res.status})`;
    try{ const err = await res.json(); if(err.error && err.error.message) msg = err.error.message; }catch(e){}
    throw new Error(msg);
  }
  return res.json();
}

async function createSpreadsheet(title){
  const data = await sheetsApiFetch("", { method: "POST", body: JSON.stringify({ properties: { title } }) });
  return data.spreadsheetId;
}

async function writeRowsToSheet(spreadsheetId, columns, rows, mode, onProgress){
  if(mode === "overwrite"){
    await sheetsApiFetch(`/${spreadsheetId}/values/A1:ZZ100000:clear`, { method: "POST", body: "{}" });
    await sheetsApiFetch(`/${spreadsheetId}/values/A1?valueInputOption=RAW`, {
      method: "PUT",
      body: JSON.stringify({ values: [columns] })
    });
  }
  const CHUNK = 500;
  for(let i = 0; i < rows.length; i += CHUNK){
    const chunk = rows.slice(i, i + CHUNK).map(row => columns.map(c => row[c] ?? ""));
    await sheetsApiFetch(`/${spreadsheetId}/values/A1:append?valueInputOption=RAW&insertDataOption=INSERT_ROWS`, {
      method: "POST",
      body: JSON.stringify({ values: chunk })
    });
    if(onProgress) onProgress(Math.min(i + CHUNK, rows.length), rows.length);
  }
}

async function exportToGoogleSheets(dataset){
  // This uses a Google sign-in POPUP (OAuth), which needs Google to recognize
  // the exact web address this page is running from. When this page is
  // embedded in a Google Site, it actually runs inside a nested sandboxed
  // frame with no predictable, registrable address — so Google's sign-in
  // rejects it outright (an "accounts.google.com/.../oauth/error" 404),
  // before this app's own code ever runs. That is a platform limitation of
  // Google Sites embeds, not something fixable from inside this app.
  //
  // "Central Sheet Setup" (QC Master Data page) is the reliable path to a
  // shared Google Sheet from inside a Sites embed — it uses a plain web
  // request instead of a sign-in popup. Point people there instead of here.
  const proceed = await showAppConfirm(
    "Heads up: Google Sheets export here uses a Google sign-in popup, which usually fails when this site is embedded in Google Sites (Google rejects the sign-in because of how Sites sandboxes embedded pages).\n\n" +
    "For syncing to a shared Google Sheet, use \"Central Sheet Setup\" from the sidebar instead — it doesn't need this popup and works reliably here.\n\n" +
    "Click OK to try the Google sign-in popup anyway (e.g. if you're running this page outside of Google Sites), or Cancel to go use Central Sheet Setup instead."
  );
  if(!proceed) return;
  try{
    if(!getGoogleClientId()){
      const id = await showAppPrompt("One-time setup: paste your Google OAuth Client ID (see the Google Sheets setup instructions provided with this site):");
      if(!id) return;
      setGoogleClientId(id.trim());
    }
    updateCompileStatus("Connecting to Google...");
    await ensureGoogleAuth();

    let spreadsheetId = getLastSpreadsheetId();
    const useExisting = spreadsheetId && await showAppConfirm(`Use the previously used spreadsheet (ID: ${spreadsheetId})?\n\nClick Cancel to create a new spreadsheet instead.`);
    if(!useExisting){
      updateCompileStatus("Creating spreadsheet...");
      spreadsheetId = await createSpreadsheet("Kenzen Warehouse QA - Compiled Reports");
      setLastSpreadsheetId(spreadsheetId);
    }

    const synced = getSyncedIds(spreadsheetId);
    const isFirstWrite = synced.size === 0;
    const newRows = dataset.rows.filter(row => !synced.has(row["Record ID"]));

    if(!newRows.length && !isFirstWrite){
      updateCompileStatus("");
      showToast("Nothing new to sync — all selected records are already in this sheet.");
      return;
    }

    const rowsToWrite = isFirstWrite ? dataset.rows : newRows;
    await writeRowsToSheet(spreadsheetId, dataset.columns, rowsToWrite, isFirstWrite ? "overwrite" : "append",
      (done, total) => updateCompileStatus(`Writing to Google Sheets... ${done}/${total}`));

    dataset.rows.forEach(row => synced.add(row["Record ID"]));
    saveSyncedIds(spreadsheetId, synced);

    updateCompileStatus("");
    showToast(`Synced ${rowsToWrite.length} row(s) to Google Sheets ✓`);
    if(await showAppConfirm("Done. Open the spreadsheet now?")){
      window.open(`https://docs.google.com/spreadsheets/d/${spreadsheetId}/edit`, "_blank");
    }
  }catch(err){
    updateCompileStatus("");
    if(err.message === "NO_CLIENT_ID"){
      await showAppAlert("Google Sheets export needs a one-time setup (a Google OAuth Client ID). See the setup instructions provided with this site.");
    } else if(err.message === "GIS_NOT_LOADED"){
      await showAppAlert("Google's sign-in library didn't load — check your internet connection and that this page isn't blocking third-party scripts, then try again.");
    } else {
      await showAppAlert("Google Sheets export failed: " + (err.message || err) +
        "\n\nIf this site is embedded in Google Sites, this sign-in popup usually can't work here — use \"Central Sheet Setup\" from the sidebar instead, or use Download CSV / Download Excel on this page.");
    }
  }
}

let currentFormImages = [];

function renderFormEntry(formId, recordId){
  const def = FORMS[formId];

  if(recordId){
    existing = getRecords(formId).find(r => r.id === recordId) || {};
  }
  currentFormImages = (existing.__images || []).slice();
  const lists = loadLists();
  const fieldsHtml = def.fields.map(f => {
    const val = existing[f.key] || "";
    const spanClass = f.full ? "full" : "";
    let inputHtml = "";
    if(f.type === "text" && (SUPPLIER_FIELD_KEYS.has(f.key) || MATERIAL_FIELD_KEYS.has(f.key))){
      const listType = SUPPLIER_FIELD_KEYS.has(f.key) ? "suppliers" : "materials";
      let items = (lists[listType] || []).slice();
      if(val && !items.includes(val)) items.push(val);
      items.sort();
      inputHtml = `<select name="${f.key}" onchange="handleListFieldChange(this,'${listType}')" ${f.required ? "required" : ""}>
        <option value="">Select...</option>

        <option value="__add_new__">+ Add New...</option>
      </select>`;
    } else if(f.type === "select"){
      inputHtml = `<select name="${f.key}" ${f.required ? "required" : ""}>

function resizeImage(file, maxWidth, quality){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = function(e){
      const img = new Image();
      img.onload = function(){
        let width = img.width, height = img.height;
        if(width > maxWidth){
          height = Math.round(height * (maxWidth / width));
          width = maxWidth;
        }
        const canvas = document.createElement("canvas");
        canvas.width = width; canvas.height = height;
        canvas.getContext("2d").drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function attachFormHandler(formId, recordId){
  const form = document.getElementById("qaForm");
  const imageInput = document.getElementById("imageInput");
  renderImagePreview();
  imageInput.addEventListener("change", async function(e){
    const files = Array.from(e.target.files);
    for(const file of files){
      try{
        const dataUrl = await resizeImage(file, 1000, 0.7);
        currentFormImages.push({name: file.name, dataUrl});
      }catch(err){ /* skip file that failed to load */ }
    }
    renderImagePreview();
    imageInput.value = "";
  });
  form.addEventListener("submit", async function(e){
    e.preventDefault();
    const def = FORMS[formId];
    const record = {};
    def.fields.forEach(f => { record[f.key] = form.elements[f.key].value; });
    record.__images = currentFormImages;
    let saved;
    if(recordId){
      saved = await updateRecord(formId, recordId, record);
    } else {
      saved = await addRecord(formId, record);
    }
    if(isFlagged(formId, saved)){
      showToast("⚠ Entry saved — flagged for review", true);
    } else {
      showToast(recordId ? "Entry updated" : "Entry saved");
    }
    syncRecordToCentral(formId, saved);
    navigate(`#/form/${formId}/records`);
  });
}

            <span class="btn btn-secondary btn-small" onclick="navigate('#/form/${formId}/edit/${r.id}')">Edit</span>
            <span class="btn btn-secondary btn-small" onclick="generatePDF('${formId}','${r.id}')">PDF</span>
            <span class="btn btn-danger btn-small" onclick="handleDelete('${formId}','${r.id}')">Delete</span>
          </td>
        </tr>`).join("")
    : `<tr><td colspan="${displayFields.length + 3}" class="empty-state">No entries yet. Click "+ New Entry" in the sidebar to add one.</td></tr>`;

  return `
    <h2>${def.title}</h2>
    <div class="subtitle">${records.length} total entr${records.length === 1 ? "y" : "ies"}</div>
    <div class="card">
      <div class="toolbar">
        <input type="search" id="searchBox" placeholder="Search records..." oninput="filterTable(this.value)">
        <div class="btn-row" style="margin-top:0;">
          <a class="btn btn-primary" onclick="navigate('#/form/${formId}/new')">+ New Entry</a>
          <a class="btn btn-secondary" onclick="exportCSV('${formId}')">Export CSV</a>
        </div>
      </div>
      <div style="overflow-x:auto;">
        <table id="recordsTable">
          <thead><tr>${displayFields.map(f => `<th>${f.label}</th>`).join("")}<th>Status</th><th>Photos</th><th>Actions</th></tr></thead>
          <tbody>${rowsHtml}</tbody>
        </table>
      </div>
    </div>
  `;
}

function attachRecordsHandlers(formId){ /* handlers wired via inline onclick for simplicity */ }

function filterTable(query){
  const rows = document.querySelectorAll("#recordsTable tbody tr");
  const q = query.toLowerCase();
  rows.forEach(row => {
    row.style.display = row.textContent.toLowerCase().includes(q) ? "" : "none";
  });
}

async function handleDelete(formId, id){
  if(await showAppConfirm("Delete this entry? This cannot be undone.")){
    deleteRecord(formId, id);
    showToast("Entry deleted");
    render();
  }
}

/* ---------------------------------------------------------
   EXPORT / IMPORT / PRINT
--------------------------------------------------------- */
function exportCSV(formId){
  const def = FORMS[formId];
  const records = getRecords(formId);
  if(!records.length){ showToast("No records to export"); return; }
  const headers = def.fields.map(f => f.label).concat(["Photos Attached"]);
  const rows = records.map(r => def.fields.map(f => csvEscape(r[f.key] ?? "")).concat([csvEscape((r.__images||[]).length)]));
  const csv = [headers.join(","), ...rows.map(r => r.join(","))].join("\n");
  downloadFile(`${formId}_records.csv`, csv, "text/csv");
}

function csvEscape(val){
  const s = String(val).replace(/"/g,'""');
  return /[,"\n]/.test(s) ? `"${s}"` : s;
}

function exportAllJSON(){
  const data = loadData();
  downloadFile("warehouse_qa_backup.json", JSON.stringify(data, null, 2), "application/json");
  showToast("Backup downloaded");
}

function importAllJSON(event){
  const file = event.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    try{
      const incoming = JSON.parse(e.target.result);
      const current = loadData();
      Object.keys(incoming).forEach(formId => {
        if(!current[formId]) current[formId] = [];
        current[formId] = current[formId].concat(incoming[formId]);
      });
      saveData(current);
      showToast("Data restored");
      render();
    }catch(err){
      showAppAlert("Could not read that file. Make sure it's a backup exported from this site.");
    }
  };
  reader.readAsText(file);
  event.target.value = "";
}

function downloadFile(filename, content, mime){
  const blob = new Blob([content], {type: mime});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

/* ---------------------------------------------------------
   PDF EXPORT (dynamic fields + photos + fillable signature/date)
--------------------------------------------------------- */
function buildPdfFilename(formId, record){
  const def = FORMS[formId];
  const namePart = def.title.replace(/[^a-zA-Z0-9]+/g, "_").replace(/^_+|_+$/g, "");
  const datePart = record.date || "undated";
  const codeKey = ["materialCode","batchNo","grnNo","stationId","vendorName","supplier"].find(k => record[k]);
  const rawCode = codeKey ? String(record[codeKey]) : record.id.slice(-8);
  const codePart = rawCode.replace(/[^a-zA-Z0-9-]+/g, "_").replace(/^_+|_+$/g, "").slice(0, 40) || record.id.slice(-8);
  return `${namePart}_${datePart}_${codePart}.pdf`;
}

function generatePDF(formId, id){
  // Open the tab synchronously (on the click) so popup blockers don't interfere
  // once the async PDF-building work below finishes.
  const previewWin = window.open("", "_blank");
  buildAndShowPDF(formId, id, previewWin).catch(err => {
    console.error(err);
    if(previewWin && !previewWin.closed) previewWin.close();
    showAppAlert("Could not generate the PDF: " + (err && err.message ? err.message : err));
  });
}

async function buildAndShowPDF(formId, id, previewWin){
  if(typeof PDFLib === "undefined"){
    throw new Error("The PDF library didn't load — check your internet connection and try again.");
  }
  const def = FORMS[formId];
  const record = getRecords(formId).find(r => r.id === id);
  if(!record) throw new Error("Record not found.");

  const { PDFDocument, StandardFonts, rgb } = PDFLib;
  const pdfDoc = await PDFDocument.create();
  const font = await pdfDoc.embedFont(StandardFonts.Helvetica);
  const fontBold = await pdfDoc.embedFont(StandardFonts.HelveticaBold);

  const PAGE_W = 595.28, PAGE_H = 841.89; // A4
  const MARGIN = 40;
  const CONTENT_W = PAGE_W - MARGIN * 2;
  const LABEL_W = 190;
  const VALUE_W = CONTENT_W - LABEL_W;
  const LINE_H = 12;
  const DARK = rgb(0.06, 0.24, 0.18);
  const GRAY_TEXT = rgb(0.35, 0.4, 0.38);
  const BORDER = rgb(0.82, 0.85, 0.83);
  const TEXT = rgb(0.12, 0.12, 0.12);

  let page = pdfDoc.addPage([PAGE_W, PAGE_H]);
  let y = PAGE_H - MARGIN;

  function wrapText(text, useFont, size, maxWidth){
    const words = String(text ?? "").split(/\s+/).filter(Boolean);
    if(!words.length) return [""];
    const lines = [];
    let current = "";
    words.forEach(word => {
      const test = current ? current + " " + word : word;
      if(useFont.widthOfTextAtSize(test, size) > maxWidth && current){
        lines.push(current);
        current = word;
      } else {
        current = test;
      }
    });
    if(current) lines.push(current);
    return lines;
  }

  function newPage(){
    page = pdfDoc.addPage([PAGE_W, PAGE_H]);
    y = PAGE_H - MARGIN;
    page.drawText(`${def.title} — continued`, { x: MARGIN, y, size: 10, font: fontBold, color: GRAY_TEXT });
    y -= 12;
    page.drawText(`Record ID: ${record.id}`, { x: MARGIN, y, size: 8, font, color: GRAY_TEXT });
    y -= 16;
  }
  function ensureSpace(h){
    if(y - h < MARGIN + 20) newPage();
  }

  // Header
  page.drawText("Kenzen Ventures Pvt Ltd", { x: MARGIN, y, size: 13, font: fontBold, color: DARK });
  y -= 16;
  page.drawText("Warehouse QA Documentation", { x: MARGIN, y, size: 9, font, color: GRAY_TEXT });
  y -= 18;
  page.drawText(def.title, { x: MARGIN, y, size: 14, font: fontBold, color: DARK });
  y -= 16;
  page.drawText(`Record ID: ${record.id}    Date: ${record.date || "-"}`, { x: MARGIN, y, size: 9, font, color: GRAY_TEXT });
  y -= 14;
  page.drawLine({ start: { x: MARGIN, y }, end: { x: PAGE_W - MARGIN, y }, thickness: 1, color: BORDER });
  y -= 14;

  // Field table — built dynamically from this form's own field definitions, not hard-coded
  def.fields.forEach(f => {
    const raw = record[f.key];
    const value = (raw === undefined || raw === null || raw === "") ? "-" : String(raw);
    const labelLines = wrapText(f.label, fontBold, 9.5, LABEL_W - 10);
    const valueLines = wrapText(value, font, 9.5, VALUE_W - 10);
    const rowLines = Math.max(labelLines.length, valueLines.length);
    const rowHeight = rowLines * LINE_H + 10;
    ensureSpace(rowHeight);
    const rowTop = y;
    page.drawRectangle({ x: MARGIN, y: rowTop - rowHeight, width: CONTENT_W, height: rowHeight, borderColor: BORDER, borderWidth: 0.75 });
    page.drawLine({ start: { x: MARGIN + LABEL_W, y: rowTop }, end: { x: MARGIN + LABEL_W, y: rowTop - rowHeight }, thickness: 0.75, color: BORDER });
    labelLines.forEach((line, i) => {
      page.drawText(line, { x: MARGIN + 6, y: rowTop - 12 - i * LINE_H, size: 9.5, font: fontBold, color: TEXT });
    });
    valueLines.forEach((line, i) => {
      page.drawText(line, { x: MARGIN + LABEL_W + 6, y: rowTop - 12 - i * LINE_H, size: 9.5, font, color: TEXT });
    });
    y = rowTop - rowHeight;
  });

  // Photos — every attached image, embedded at real quality, never a placeholder
  const images = record.__images || [];
  if(images.length){
    ensureSpace(30);
    y -= 10;
    page.drawText(`Photos (${images.length})`, { x: MARGIN, y, size: 12, font: fontBold, color: DARK });
    y -= 16;

    const GAP = 10;
    const COLS = 2;
    const BOX_W = (CONTENT_W - GAP * (COLS - 1)) / COLS;
    const BOX_H = 170;
    let col = 0;
    let rowTop = y;

    for(const imgObj of images){
      try{
        const base64 = imgObj.dataUrl.split(",")[1];
        const bytes = Uint8Array.from(atob(base64), c => c.charCodeAt(0));
        const embedded = imgObj.dataUrl.startsWith("data:image/png")
          ? await pdfDoc.embedPng(bytes)
          : await pdfDoc.embedJpg(bytes);
        const scaled = embedded.scaleToFit(BOX_W - 8, BOX_H - 8);

        if(col === 0){
          ensureSpace(BOX_H + 14);
          rowTop = y;
        }
        const boxX = MARGIN + col * (BOX_W + GAP);
        const imgX = boxX + (BOX_W - scaled.width) / 2;
        const imgY = rowTop - BOX_H + (BOX_H - scaled.height) / 2;
        page.drawRectangle({ x: boxX, y: rowTop - BOX_H, width: BOX_W, height: BOX_H, borderColor: BORDER, borderWidth: 0.75 });
        page.drawImage(embedded, { x: imgX, y: imgY, width: scaled.width, height: scaled.height });

        col++;
        if(col >= COLS){ col = 0; y = rowTop - BOX_H - 14; }
      }catch(imgErr){
        ensureSpace(14);
        page.drawText(`(Photo "${imgObj.name || "unnamed"}" could not be embedded)`, { x: MARGIN, y, size: 8.5, font, color: rgb(0.6,0.2,0.2) });
        y -= 14;
      }
    }
    if(col !== 0) y = rowTop - BOX_H - 14;
  }

  // Signature & Date — real fillable AcroForm text fields, not drawn lines.
  //
  // ROOT CAUSE of "No /DA (default appearance) entry found for field": pdf-lib
  // only creates a text field's /DA entry the first time an appearance stream
  // is generated for it, which happens inside addToPage(). PDFTextField's own
  // setFontSize() requires that /DA to already exist, so calling setFontSize()
  // BEFORE addToPage() throws this exact error. The fix is to always call
  // addToPage() first, then setFontSize(). This is independent of which form
  // fields are filled in, whether photos are attached, etc. — it happens for
  // every single record because it happens before that record's data is even
  // looked at.
  //
  // Each field is also individually wrapped in try/catch as a second line of
  // defense: if creating either interactive field ever fails for any reason
  // pdf-lib introduces in the future, PDF generation still completes — that
  // one field just becomes a plain (non-fillable) line instead of aborting
  // the whole document.
  ensureSpace(50);
  y -= 12;
  const form = pdfDoc.getForm();

  page.drawText("Signature:", { x: MARGIN, y, size: 10, font: fontBold, color: TEXT });
  try{
    const sigField = form.createTextField(`signature_${record.id}`);
    sigField.addToPage(page, { x: MARGIN + 65, y: y - 4, width: 210, height: 16, borderWidth: 0.75, borderColor: rgb(0.6,0.6,0.6) });
    sigField.setFontSize(11);
  }catch(fieldErr){
    console.error("Signature field could not be created as a fillable field — drew a plain box instead.", fieldErr);
    page.drawRectangle({ x: MARGIN + 65, y: y - 4, width: 210, height: 16, borderColor: rgb(0.6,0.6,0.6), borderWidth: 0.75 });
  }

  page.drawText("Date:", { x: MARGIN + 310, y, size: 10, font: fontBold, color: TEXT });
  try{
    const dateField = form.createTextField(`date_${record.id}`);
    dateField.addToPage(page, { x: MARGIN + 345, y: y - 4, width: 130, height: 16, borderWidth: 0.75, borderColor: rgb(0.6,0.6,0.6) });
    dateField.setFontSize(11);
  }catch(fieldErr){
    console.error("Date field could not be created as a fillable field — drew a plain box instead.", fieldErr);
    page.drawRectangle({ x: MARGIN + 345, y: y - 4, width: 130, height: 16, borderColor: rgb(0.6,0.6,0.6), borderWidth: 0.75 });
  }

  // Page numbers on every page
  const allPages = pdfDoc.getPages();
  allPages.forEach((p, idx) => {
    p.drawText(`Page ${idx + 1} of ${allPages.length}`, { x: PAGE_W - MARGIN - 80, y: 24, size: 8.5, font, color: GRAY_TEXT });
  });

  const pdfBytes = await pdfDoc.save();
  const blob = new Blob([pdfBytes], { type: "application/pdf" });
  const url = URL.createObjectURL(blob);
  const filename = buildPdfFilename(formId, record);

  if(previewWin && !previewWin.closed){
    previewWin.location.href = url;
  } else {
    window.open(url, "_blank");
  }
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 60000);

  showToast("PDF generated");
}

function viewImages(formId, id){
  const record = getRecords(formId).find(r => r.id === id);
  const images = record ? (record.__images || []) : [];
  if(!images.length){ showToast("No photos for this entry"); return; }
  const win = window.open("", "_blank");
  win.document.write(`
    <html><head><title>Photos - ${FORMS[formId].title}</title></head>
    <body style="font-family:Arial,sans-serif;padding:24px;background:#33391f;">
      <h3 style="color:#fff;margin-top:0;">${FORMS[formId].title} &middot; ${record.date || ""}</h3>
      <div style="display:flex;flex-wrap:wrap;gap:14px;">
        ${images.map(img => `<img src="${img.dataUrl}" style="max-width:320px;border-radius:8px;border:2px solid #707c48;">`).join("")}
      </div>
    </body></html>
  `);
  win.document.close();
}

/* ---------------------------------------------------------
   UTIL
--------------------------------------------------------- */
function escapeHtml(str){
  return String(str)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}
function showToast(msg, isWarning){
  const toast = document.getElementById("toast");
  toast.textContent = msg;
  toast.style.background = isWarning ? "var(--red-600)" : "var(--green-900)";
  toast.classList.add("show");
  setTimeout(() => toast.classList.remove("show"), 2600);
}
